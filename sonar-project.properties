# SonarCloud analysis configuration.
#
# --- Copy/paste (duplication) exclusions -------------------------------------
# ~69% of the Swift in this repo is generated Cuckoo mocks (Tests/Mock/*.swift),
# which are structurally near-identical across modules and dominate the reported
# duplication. Test code also legitimately repeats setup/assertion boilerplate.
sonar.cpd.exclusions=**/Tests/**,**/*Mock*.swift

# --- Full-analysis exclusions -------------------------------------------------
# Generated and vendored code should not be analyzed for smells or counted in
# ncloc. (Honored on PR analysis; overridden by the command-line value on push —
# see note above.)
sonar.exclusions=**/Tests/Mock/GeneratedMocks.swift,**/Tests/Mock/TestMock.swift,**/.build/**,**/DerivedData/**
